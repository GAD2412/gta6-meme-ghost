  <g>
    <ellipse cx="540" cy="838" rx="190" ry="22" fill="#000" opacity="0.25"/>
    <!-- arms -->
    <ellipse cx="338" cy="640" rx="34" ry="62" transform="rotate(35 338 640)" fill="#fff" stroke="#d9d4ee" stroke-width="5"/>
    <ellipse cx="768" cy="470" rx="34" ry="80" transform="rotate(-18 768 470)" fill="#fff" stroke="#d9d4ee" stroke-width="5"/>
    <!-- body -->
    <path d="M350 810 V540 C350 410 430 340 540 340 C650 340 730 410 730 540 V810 q-23.75 -45 -47.5 0 q-23.75 45 -47.5 0 q-23.75 -45 -47.5 0 q-23.75 45 -47.5 0 q-23.75 -45 -47.5 0 q-23.75 45 -47.5 0 q-23.75 -45 -47.5 0 q-23.75 45 -47.5 0Z"
          fill="#fff" stroke="#d9d4ee" stroke-width="5" stroke-linejoin="round"/>
    <!-- sparkle eyes -->
    <use href="#star" transform="translate(470 540) scale(46)" fill="#1b1033"/>
    <use href="#star" transform="translate(610 540) scale(46)" fill="#1b1033"/>
    <circle cx="484" cy="524" r="5" fill="#fff"/><circle cx="624" cy="524" r="5" fill="#fff"/>
    <path d="M505 625 Q540 665 575 625" fill="none" stroke="#1b1033" stroke-width="9" stroke-linecap="round"/>
