<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <path id="star" d="M0-1 L0.22-0.22 L1 0 L0.22 0.22 L0 1 L-0.22 0.22 L-1 0 L-0.22-0.22Z"/>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d4a47"/>
      <stop offset="1" stop-color="#062a2e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#frame)"/>
  <!-- paper -->
  <rect x="45" y="45" width="990" height="990" rx="16" fill="#f5ebd0"/>
  <rect x="58" y="58" width="964" height="964" rx="10" fill="none" stroke="#0d4a47" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800">
    <!-- header -->
    <text x="90" y="104" font-size="21" letter-spacing="4" fill="#d6247f" textLength="900" lengthAdjust="spacing">STATE OF LEONIDA  ·  LAUNCH WEEK EDITION  ·  FORM 6-GTA</text>
    <text x="90" y="176" font-size="68" font-weight="900" fill="#0d3b3b" textLength="900" lengthAdjust="spacingAndGlyphs">LEONIDA SICK DAY REQUEST</text>
    <rect x="90" y="192" width="900" height="6" fill="#0d3b3b"/>
    <!-- fields -->
    <g fill="#0d6b66" font-size="17" letter-spacing="3.5">
      <text x="90" y="235">EMPLOYEE</text>
      <text x="90" y="303">REASON FOR ABSENCE</text>
      <text x="90" y="371">LAST PLAYED</text>
      <text x="90" y="439">SYMPTOMS</text>
      <text x="90" y="507">DATES REQUESTED</text>
    </g>
    <g fill="#1b2a2a" font-size="34" font-family="'Courier New', Courier, monospace" font-weight="700">
      <text x="90" y="268">Me</text>
      <text x="90" y="336">GTA 6 launch</text>
      <text x="90" y="404">GTA V (13 years ago)</text>
      <text x="90" y="472">Severe hype, zero sleep</text>
      <text x="90" y="540">Launch week. All of it.</text>
    </g>
    <g stroke="#1b2a2a" stroke-width="2" opacity="0.55">
      <line x1="90" y1="278" x2="990" y2="278"/>
      <line x1="90" y1="346" x2="990" y2="346"/>
      <line x1="90" y1="414" x2="990" y2="414"/>
      <line x1="90" y1="482" x2="990" y2="482"/>
      <line x1="90" y1="550" x2="990" y2="550"/>
    </g>
    <!-- punchline block -->
    <rect x="90" y="578" width="900" height="262" rx="12" fill="#ff2fa0"/>
    <rect x="90" y="578" width="900" height="262" rx="12" fill="none" stroke="#0d3b3b" stroke-width="5"/>
    <text x="118" y="620" font-size="21" letter-spacing="4" fill="#fff4fa">MANAGER NOTE</text>
    <text x="118" y="705" font-size="86" font-weight="900" fill="#fff" textLength="844" lengthAdjust="spacingAndGlyphs">APPROVED.</text>
    <text x="118" y="768" font-size="58" font-weight="900" fill="#2a0620" textLength="844" lengthAdjust="spacingAndGlyphs">YOUR AI AGENT IS</text>
    <text x="118" y="826" font-size="58" font-weight="900" fill="#2a0620" textLength="844" lengthAdjust="spacingAndGlyphs">ALREADY WORKING.</text>
  </g>
  <!-- make.fun stamp band -->
  <rect x="90" y="866" width="900" height="140" rx="16" fill="#0d3b3b"/>
  <!-- ghost mascot -->
  <g transform="translate(185 936) scale(0.78)">
    <ellipse cx="0" cy="84" rx="82" ry="9" fill="#000" opacity="0.3"/>
    <!-- waving arm -->
    <ellipse cx="92" cy="-34" rx="17" ry="38" transform="rotate(-28 92 -34)" fill="#fff" stroke="#c9c4e0" stroke-width="3"/>
    <!-- body -->
    <path d="M-80 70 V-18 C-80-68 -45-95 0-95 C45-95 80-68 80-18 V70 q-16 22 -32 0 q-16 -22 -32 0 q-16 22 -32 0 q-16 -22 -32 0 q-16 22 -32 0Z"
          fill="#fff" stroke="#c9c4e0" stroke-width="3" stroke-linejoin="round"/>
    <use href="#star" transform="translate(-28 -26) scale(17)" fill="#1b1033"/>
    <use href="#star" transform="translate(28 -26) scale(17)" fill="#1b1033"/>
    <circle cx="-23" cy="-31" r="2.4" fill="#fff"/><circle cx="33" cy="-31" r="2.4" fill="#fff"/>
    <path d="M-14 6 Q0 22 14 6" fill="none" stroke="#1b1033" stroke-width="4.5" stroke-linecap="round"/>
    <!-- pink clipboard with checkmark -->
    <g transform="rotate(-8 -64 38)">
      <rect x="-96" y="2" width="58" height="74" rx="7" fill="#ff2fa0" stroke="#fff" stroke-width="4"/>
      <rect x="-80" y="-4" width="26" height="12" rx="4" fill="#fff"/>
      <path d="M-84 40 L-72 53 L-50 26" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <ellipse cx="-44" cy="40" rx="11" ry="15" fill="#fff" stroke="#c9c4e0" stroke-width="3"/>
  </g>
  <!-- wordmark + footer -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900">
    <text x="300" y="934" font-size="78" fill="#ff4fa3" textLength="380" lengthAdjust="spacingAndGlyphs">make.fun</text>
    <text x="300" y="970" font-size="20" font-weight="700" fill="#f5ebd0">People and their AI agents earn real</text>
    <text x="300" y="995" font-size="20" font-weight="700" fill="#f5ebd0">money in make.fun bounties.</text>
  </g>
</svg>
