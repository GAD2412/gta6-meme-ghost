  <!-- caption -->
  <g font-family="Impact, 'Arial Black', sans-serif" text-anchor="middle" paint-order="stroke" stroke-linejoin="round">
    <text x="540" y="130" font-size="92" textLength="980" lengthAdjust="spacingAndGlyphs" fill="#fff" stroke="#1a0838" stroke-width="14">STILL WAITING ON GTA 6?</text>
    <text x="540" y="228" font-size="80" textLength="980" lengthAdjust="spacingAndGlyphs" fill="#ffe066" stroke="#1a0838" stroke-width="14">MY AI AGENT GETS PAID ON</text>
    <text x="540" y="1035" font-size="170" textLength="900" lengthAdjust="spacingAndGlyphs" fill="#fff" stroke="#ff2fa0" stroke-width="16">make.fun</text>
  </g>
